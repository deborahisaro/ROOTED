<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Rooted</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Yellowtail&family=Playfair+Display:wght@500&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap">
<style>
/* Layout: one-column app with a striped poster hero, a winding lesson path, and a fixed bottom tab bar */
:root{
  --pink:#ACC048; --pink-deep:#5F7020;
  --cream:#F6F4DF; --paper:#FBFAEF;
  --brown:#780F0F; --brown-deep:#560A0A;
  --bg:var(--cream); --fg:var(--brown); --surface:var(--paper);
  --muted:#8C5A50; --line:#DFE2BE;
  --hero-bg:var(--brown); --hero-stripe:#690D0D; --hero-fg:var(--cream);
  --ok:#4E6A1C; --ok-bg:#E6EDC6; --bad:#A3261A; --bad-bg:#F6D6CF;
  --display:"Bowlby One","Arial Black",Impact,sans-serif;
  --script:"Yellowtail","Brush Script MT",cursive;
  --body:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#240808; --fg:#F6F4DF; --surface:#361010; --muted:#D6B3A8; --line:#571A1A;
  --hero-bg:#560A0A; --hero-stripe:#4A0808; --hero-fg:#F6F4DF;
  --ok:#C4D878; --ok-bg:#2F3515; --bad:#F29A8A; --bad-bg:#4A1616; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#240808; --fg:#F6F4DF; --surface:#361010; --muted:#D6B3A8; --line:#571A1A;
  --hero-bg:#560A0A; --hero-stripe:#4A0808; --hero-fg:#F6F4DF;
  --ok:#C4D878; --ok-bg:#2F3515; --bad:#F29A8A; --bad-bg:#4A1616; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:16px 120px;display:flex;flex-direction:column;gap:28px}

/* top bar */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--display);font-size:22px;letter-spacing:.5px;display:flex;align-items:center;gap:8px}
.stats{display:flex;gap:8px}
.stat{display:flex;align-items:center;gap:5px;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:4px 10px;font-weight:800;font-variant-numeric:tabular-nums;font-size:14px}
.stat svg{width:16px;height:16px}

/* hero */
.hero{position:relative;border-radius:22px;overflow:hidden;color:var(--hero-fg);padding:26px 22px 24px;
  background:repeating-linear-gradient(90deg,var(--hero-bg) 0 36px,var(--hero-stripe) 36px 72px)}
.hero .kicker{font-family:var(--script);color:var(--pink);font-size:26px;transform:rotate(-5deg);display:inline-block;margin-left:4px}
.hero h1{font-family:var(--display);font-size:clamp(58px,17vw,104px);line-height:.86;letter-spacing:-1px}
.hero p{margin:0;max-width:30ch;font-weight:600;color:var(--hero-fg);opacity:.92}
.burst{position:absolute;z-index:1;right:14px;top:18px;width:108px;height:108px;display:grid;place-items:center;text-align:center}
.burst svg{position:absolute;inset:0;width:100%;height:100%}
.burst span{position:relative;font-family:var(--display);color:var(--brown);font-size:13px;line-height:1.05}
.burst b{display:block;font-size:30px}
@media (prefers-reduced-motion:no-preference){.burst svg{animation:spin 30s linear infinite}}
@keyframes spin{to{transform:rotate(360deg)}}

/* daily verse */
.daily{background:var(--pink);color:var(--brown);border-radius:22px;padding:20px 22px;display:flex;flex-direction:column;gap:8px}
.label{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.daily blockquote{margin:0;font-size:18px;font-weight:600;line-height:1.45;text-wrap:pretty}
.daily cite{font-family:var(--display);font-style:normal;font-size:15px}

/* section heads */
.shead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.shead h2{font-family:var(--display);font-size:28px;line-height:1;margin:0;text-wrap:balance}
.shead .script{font-family:var(--script);color:var(--pink-deep);font-size:24px}

/* path */
.unit{display:flex;flex-direction:column;gap:18px}
.unit-banner{background:var(--hero-bg);color:var(--hero-fg);border-radius:18px;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.unit-banner h3{margin:0;font-family:var(--display);font-size:20px;line-height:1.1}
.unit-banner small{font-weight:600;opacity:.8;display:block}
.unit-banner .count{font-family:var(--display);font-size:14px;background:var(--pink);color:var(--brown);border-radius:999px;padding:4px 10px;white-space:nowrap}
.path{display:flex;flex-direction:column;align-items:center;gap:14px;padding-block:6px}
.node{position:relative;width:84px;height:84px;border:none;background:none;padding:0;display:grid;place-items:center}
.node .disc{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;border:4px solid var(--brown);box-shadow:0 6px 0 var(--brown);transition:transform .12s}
.node:active .disc{transform:translateY(4px);box-shadow:0 2px 0 var(--brown)}
.node.done .disc{background:var(--brown);color:var(--cream)}
.node.current .disc{background:var(--pink);color:var(--brown)}
.node.locked{cursor:not-allowed}
.node.locked .disc{background:var(--surface);border-color:var(--line);box-shadow:0 6px 0 var(--line);color:var(--muted)}
.node svg{width:32px;height:32px}
.node .tag{position:absolute;top:-30px;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);font-weight:800;font-size:12px;letter-spacing:.1em;text-transform:uppercase;padding:4px 10px;border-radius:8px;white-space:nowrap}
.node .name{position:absolute;top:50%;transform:translateY(-50%);width:130px;font-weight:800;font-size:14px;line-height:1.2}
.node.right .name{right:94px;text-align:right}
.node.left .name{left:94px}

/* feelings */
.moods{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.mood{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:12px;text-align:left;font-weight:800;display:flex;align-items:center;gap:10px}
.mood i{width:14px;height:14px;border-radius:50%;flex:none;background:var(--c)}
.mood[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.verse-card{position:relative;background:var(--hero-bg);color:var(--hero-fg);border-radius:22px;padding:28px 22px 22px;display:flex;flex-direction:column;gap:14px;overflow:hidden}
.verse-card .script{font-family:var(--script);color:var(--pink);font-size:28px;line-height:1}
.verse-card blockquote{margin:0;font-size:21px;line-height:1.45;font-weight:600;text-wrap:pretty}
.verse-card cite{font-family:var(--display);font-style:normal;font-size:20px;color:var(--pink)}
.verse-card .reflect{border-top:2px dashed rgba(246,244,223,.3);padding-top:14px;font-size:15px;opacity:.95}
.verse-card .reflect b{display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--pink);margin-bottom:4px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:3px solid var(--brown);background:var(--pink);color:var(--brown);border-radius:14px;padding:12px 18px;font-weight:800;box-shadow:0 4px 0 var(--brown);transition:transform .1s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--brown)}
.btn.ghost{background:var(--cream)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:0 4px 0 var(--brown)}
.btn.wide{width:100%;font-size:17px;padding:14px}
.empty{border:2px dashed var(--line);border-radius:18px;padding:22px;color:var(--muted);font-weight:600}

/* journey */
.grow{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:20px}
.grow svg{width:96px;height:120px}
.grow h3{margin:0;font-family:var(--display);font-size:26px;line-height:1}
.grow p{margin:4px 0 10px;color:var(--muted);font-weight:600}
.bar{height:14px;border-radius:999px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pink);border-right:3px solid var(--brown);border-radius:999px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile b{font-family:var(--display);font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.tile span{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.saved{display:flex;flex-direction:column;gap:10px}
.saved-item{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:8px;align-items:start}
.saved-item p{margin:0;font-weight:600;min-width:0}
.saved-item cite{font-style:normal;font-family:var(--display);font-size:14px;display:block;margin-top:4px}
.x{border:none;background:none;color:var(--muted);font-weight:800;padding:4px}
.stages{display:flex;justify-content:space-between;gap:6px;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:8px}
.stages .on{color:var(--fg)}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:3px solid var(--fg);padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
.tabbar nav{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tab{border:none;background:none;border-radius:12px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:800;font-size:13px;color:var(--muted)}
.tab svg{width:24px;height:24px}
.tab[aria-selected="true"]{background:var(--pink);color:var(--brown)}

/* lesson overlay */
.lesson{position:fixed;inset:0;background:var(--bg);z-index:10;overflow-y:auto;padding-top:env(safe-area-inset-top,0px)}
.lesson-in{max-width:560px;margin:0 auto;min-height:100%;padding-inline:16px;padding-block:16px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:22px}
.lhead{display:flex;align-items:center;gap:12px}
.close{border:none;background:none;font-size:28px;line-height:1;padding:4px 8px;color:var(--muted)}
.prog{flex:1;height:16px;border-radius:999px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--pink);border-radius:999px;transition:width .3s}
.q-kind{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--pink-deep)}
.q-text{font-family:var(--display);font-size:clamp(22px,6vw,28px);line-height:1.15;margin:4px 0 0;text-wrap:balance}
.q-verse{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:16px;font-size:19px;font-weight:600;line-height:1.5}
.q-verse cite{display:block;font-style:normal;font-family:var(--display);font-size:14px;margin-top:6px;color:var(--muted)}
.blank{display:inline-block;min-width:70px;border-bottom:3px solid var(--pink-deep);text-align:center;color:var(--pink-deep)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 16px;text-align:left;font-weight:700;box-shadow:0 4px 0 var(--line)}
.opt[aria-pressed="true"]{border-color:var(--fg);box-shadow:0 4px 0 var(--fg);background:var(--pink);color:var(--brown)}
.build{min-height:64px;border-bottom:3px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;padding-bottom:10px}
.bank{display:flex;flex-wrap:wrap;gap:8px}
.word{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 14px;font-weight:700;box-shadow:0 3px 0 var(--line)}
.word.used{visibility:hidden}
.spacer{flex:1}
.feedback{border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.feedback.ok{background:var(--ok-bg);color:var(--ok)}
.feedback.bad{background:var(--bad-bg);color:var(--bad)}
.feedback h4{margin:0;font-family:var(--display);font-size:22px}
.feedback p{margin:0;font-weight:600;color:var(--fg)}
.finish{text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;padding-top:30px}
.finish .burst{position:relative;right:auto;top:auto;width:170px;height:170px}
.finish .burst span{font-size:18px}
.finish .burst b{font-size:44px}
.finish h2{font-family:var(--display);font-size:clamp(36px,11vw,56px);line-height:.95;margin:0}
.finish .script{font-family:var(--script);font-size:30px;color:var(--pink-deep)}
.finish p{max-width:34ch;margin:0;font-weight:600}
@media (max-width:420px){.node .name{width:104px;font-size:13px}.tiles b{font-size:24px}.burst{width:92px;height:92px}.burst b{font-size:24px}}

.title-wrap{position:relative;display:inline-block;cursor:pointer;outline:none;margin:22px 0 14px}
.title-wrap h1{position:relative;z-index:1;margin:0;transition:color .5s ease,-webkit-text-stroke-color .5s ease;-webkit-text-stroke:2px transparent}

.title-wrap:hover .roots-logo,.title-wrap:focus-visible .roots-logo,.title-wrap.on .roots-logo{opacity:1;clip-path:inset(0 0 0 0)}
.title-wrap:hover h1,.title-wrap:focus-visible h1,.title-wrap.on h1{color:transparent;-webkit-text-stroke-color:var(--hero-fg)}
.title-wrap:focus-visible{outline:3px solid var(--pink);outline-offset:6px;border-radius:8px}
.hint{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--pink);opacity:.85;margin:0 0 10px}
@media (prefers-reduced-motion:reduce){.roots-logo,.title-wrap h1{transition:opacity .2s}}
.app{position:relative;z-index:1}
.shead h2.soft{font-family:"Playfair Display",Georgia,"Times New Roman",serif;font-weight:500;font-size:32px;letter-spacing:-.3px;line-height:1.05}

/* daily goal */
.goal{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:16px 18px}
.goal svg{width:68px;height:68px}
.goal h3{margin:0;font-family:var(--display);font-size:20px;line-height:1.1}
.goal p{margin:2px 0 0;color:var(--muted);font-weight:600;font-size:14px}
.week{display:flex;gap:6px;margin-top:10px}
.week span{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:800;color:var(--muted)}
.week i{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.week .on i{background:var(--pink);border-color:var(--brown)}
.week .today{color:var(--fg)}
/* practice */
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.seg button{border:none;background:none;border-radius:10px;padding:10px;font-weight:800;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--brown);color:var(--cream)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.chip{flex:none;border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:800;font-size:14px;display:flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--pink);border-color:var(--brown);color:var(--brown)}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--brown)}
.mem{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:14px}
.mem .words{font-size:21px;font-weight:600;line-height:1.7}
.mem cite{font-family:var(--display);font-style:normal;font-size:18px}
.hw{border:none;background:var(--line);color:var(--fg);border-radius:6px;padding:0 6px;font-weight:800;letter-spacing:2px;font-size:inherit;line-height:1.3}
.rev{color:var(--pink-deep);font-weight:800}
.levels{display:flex;gap:6px;align-items:center;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.levels i{width:26px;height:8px;border-radius:4px;background:var(--line)}
.levels i.on{background:var(--pink);outline:2px solid var(--brown)}
.plan{display:flex;flex-direction:column;gap:8px}
.ch{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:10px 12px}
.ch .box{width:30px;height:30px;border-radius:9px;border:3px solid var(--brown);background:var(--paper);display:grid;place-items:center;padding:0;color:var(--brown)}
.ch.done .box{background:var(--pink)}
.ch .box svg{width:18px;height:18px}
.ch b{display:block;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.ch span{font-weight:700;min-width:0}
.ch.done span{text-decoration:line-through;text-decoration-thickness:2px;opacity:.7}
.ch a{color:var(--fg);font-weight:800;font-size:14px}
/* journal */
.journal{display:flex;flex-direction:column;gap:10px}
.journal textarea{width:100%;min-height:110px;border:2px solid var(--line);background:var(--surface);color:var(--fg);border-radius:16px;padding:14px;font:inherit;resize:vertical}
.entry{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.entry header{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.entry p{margin:0;font-weight:500;white-space:pre-wrap;overflow-wrap:anywhere}
/* badges */
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.badge{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:12px;font-weight:800;line-height:1.2;min-width:0}
.badge .medal{width:62px;height:62px;position:relative;display:grid;place-items:center}
.badge .medal svg{position:absolute;inset:0}
.badge .medal b{position:relative;font-family:var(--display);font-size:18px;color:var(--brown)}
.badge.off{color:var(--muted)}
.badge.off .medal{opacity:.35;filter:grayscale(1)}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;background:var(--brown);color:var(--cream);border:3px solid var(--pink);border-radius:16px;padding:10px 18px;font-weight:800;z-index:20;transition:.3s;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:420px){.badges{grid-template-columns:repeat(3,1fr)}.tab{font-size:12px}}

/* hand-painted brush textures (generated on a canvas at load, tinted by theme through masks) */
.tex{position:relative;overflow:hidden;isolation:isolate}
.tex::before{content:"";position:absolute;z-index:-1;pointer-events:none;background:var(--tex-c,var(--pink));opacity:var(--tex-o,.22);
  -webkit-mask-image:var(--tex-img);mask-image:var(--tex-img);-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
.hero.tex{--tex-img:var(--t-arches);--tex-o:.30}

.daily.tex::before{inset:0;-webkit-mask-size:180px;mask-size:180px;-webkit-mask-repeat:repeat;mask-repeat:repeat}

.goal.tex::before{width:130px;height:130px;right:-30px;top:-30px;-webkit-mask-size:contain;mask-size:contain}

.mem.tex::before{width:200px;height:200px;right:-50px;bottom:-60px;-webkit-mask-size:contain;mask-size:contain}

.hero-foot{position:relative;z-index:1;display:flex;align-items:flex-end;justify-content:space-between;gap:14px}

/* continue button */
.cont{display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left}
.cont small{display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.8}
.cont b{font-family:var(--display);font-size:20px;font-weight:400;line-height:1.1}
.cont svg{width:28px;height:28px;flex:none}
/* lesson feedback */
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
.shake{animation:shake .45s ease}
.combo{background:var(--pink);color:var(--brown);border:2px solid var(--brown);border-radius:999px;padding:3px 10px;font-weight:800;font-size:12px;white-space:nowrap}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.combo,.feedback{animation:pop .25s ease}
.confetti{position:fixed;pointer-events:none;z-index:30;width:0;height:0}
.confetti i{position:absolute;width:10px;height:14px;border-radius:3px;background:var(--c);animation:fly .9s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes fly{from{transform:translate(0,0) rotate(0);opacity:1}to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
.perfect{background:var(--pink);color:var(--brown);border:3px solid var(--brown);border-radius:14px;padding:8px 14px;font-weight:800}
@media (prefers-reduced-motion:reduce){.shake,.combo,.feedback{animation:none}.confetti{display:none}}
/* icon button in top bar */
.iconbtn{border:2px solid var(--line);background:var(--surface);border-radius:999px;width:34px;height:34px;display:grid;place-items:center;padding:0;color:var(--fg)}
.iconbtn svg{width:18px;height:18px}
/* share card */
.share-card{position:relative;width:100%;max-width:380px;aspect-ratio:4/5;margin:0 auto;border-radius:26px;overflow:hidden;isolation:isolate;
  background:repeating-linear-gradient(90deg,#780F0F 0 34px,#690D0D 34px 68px);color:#F6F4DF;padding:28px 24px;display:flex;flex-direction:column;gap:14px}
.share-card::before{content:"";position:absolute;z-index:-1;width:260px;height:260px;right:-70px;bottom:-80px;background:#ACC048;opacity:.35;-webkit-mask:var(--t-arches) center/contain no-repeat;mask:var(--t-arches) center/contain no-repeat}
.share-card .script{font-family:var(--script);color:#ACC048;font-size:30px;line-height:1;transform:rotate(-4deg);display:inline-block}
.share-card blockquote{margin:0;font-size:clamp(18px,5.4vw,23px);font-weight:600;line-height:1.4;text-wrap:pretty;flex:1;display:flex;align-items:center}
.share-card cite{font-family:var(--display);font-style:normal;color:#ACC048;font-size:20px}
.share-card footer{display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:2px dashed rgba(246,244,223,.35);padding-top:12px;font-family:var(--display);font-size:18px}
.share-card footer small{font-family:var(--body);font-weight:700;font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.8}
/* onboarding */
.ob{display:flex;flex-direction:column;gap:18px;padding-top:12px;min-height:100%}
.ob h2{font-family:var(--display);font-size:clamp(30px,9vw,44px);line-height:1;margin:0;text-wrap:balance}
.ob .script{font-family:var(--script);color:var(--pink-deep);font-size:30px;line-height:1}
.ob p{margin:0;font-weight:600;color:var(--muted);max-width:36ch}
.ob input[type=text]{width:100%;border:3px solid var(--brown);background:var(--surface);color:var(--fg);border-radius:14px;padding:14px 16px;font:inherit;font-size:20px;font-weight:700}
.ob .dots{display:flex;gap:6px;justify-content:center}
.ob .dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.ob .dots i.on{background:var(--pink);outline:2px solid var(--brown)}
.ob-hero{position:relative;border-radius:22px;overflow:hidden;background:repeating-linear-gradient(90deg,var(--hero-bg) 0 36px,var(--hero-stripe) 36px 72px);color:var(--hero-fg);padding:30px 22px;display:flex;flex-direction:column;gap:6px;isolation:isolate}
.ob-hero h1{font-family:var(--display);font-size:clamp(60px,18vw,110px);line-height:.86;margin:0}
.opt small{display:block;font-weight:600;color:var(--muted);font-size:14px}
.opt[aria-pressed="true"] small{color:var(--brown)}
/* settings */
.settings{display:flex;flex-direction:column;gap:10px}
.set-row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px 14px}
.set-row b{display:block}
.set-row span{font-size:14px;color:var(--muted);font-weight:600}
.set-row input[type=text]{width:140px;border:2px solid var(--line);background:var(--paper);color:var(--fg);border-radius:10px;padding:8px 10px;font:inherit;font-weight:700}
.switch{width:54px;height:32px;border-radius:999px;border:3px solid var(--brown);background:var(--line);padding:0;position:relative}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--brown);transition:transform .2s}
.switch[aria-checked="true"]{background:var(--pink)}
.switch[aria-checked="true"]::after{transform:translateX(22px)}
.mini-seg{display:flex;gap:4px}
.mini-seg button{border:2px solid var(--line);background:var(--paper);border-radius:10px;padding:6px 10px;font-weight:800;font-size:14px}
.mini-seg button[aria-pressed="true"]{background:var(--pink);border-color:var(--brown);color:var(--brown)}
@media (max-width:420px){.set-row{grid-template-columns:1fr}.set-row input[type=text]{width:100%}}

/* promise poster (Journey tab): heavy type, script, framed panels, sparkles, film grain */
.poster{position:relative;isolation:isolate;overflow:hidden;border-radius:22px;background:#780F0F;color:#ACC048;padding:18px;display:flex;flex-direction:column;gap:12px}
.poster::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(120% 80% at 80% 0%,#9A1A14 0%,transparent 60%),radial-gradient(90% 70% at 0% 100%,#560A0A 0%,transparent 70%)}
.poster::after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:#F6F4DF;opacity:.10;-webkit-mask:var(--t-grain) 0 0/180px repeat;mask:var(--t-grain) 0 0/180px repeat}
.pframe{border:2px solid #ACC048;border-radius:4px;padding:12px 14px;position:relative}
.ptop{display:grid;grid-template-columns:repeat(3,auto);justify-content:space-between;row-gap:10px;font-family:var(--body);font-weight:800;font-size:13px;letter-spacing:.12em;text-transform:uppercase}
.ptop span:nth-child(4){grid-column:1}.ptop span:nth-child(5){grid-column:2/4;justify-self:center}
.pbig{font-family:var(--display);font-size:clamp(52px,16vw,92px);line-height:.84;letter-spacing:-1px;margin:6px 0 0;text-align:center}
.pscript{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:-4px}
.pscript .oval{font-family:var(--script);font-size:clamp(22px,6.5vw,30px);border:2px solid #ACC048;border-radius:50%;padding:2px 18px;transform:rotate(-4deg)}
.pscript .big{font-family:var(--script);font-size:clamp(34px,10vw,50px);line-height:1}
.prow{display:grid;grid-template-columns:1.5fr 1fr;gap:10px}
.prow .pframe{display:flex;flex-direction:column;justify-content:center;gap:6px;min-width:0}
.prow blockquote{margin:0;color:#F6F4DF;font-weight:600;font-size:15px;line-height:1.4}
.prow cite{font-style:normal;font-weight:800;font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.prow svg{width:100%;height:auto;max-height:110px}
.spark{position:absolute;width:26px;height:26px;fill:#ACC048;pointer-events:none}
@media (prefers-reduced-motion:no-preference){.spark{animation:twinkle 2.6s ease-in-out infinite}.spark.s2{animation-delay:1.1s}.spark.s3{animation-delay:1.8s}}
@keyframes twinkle{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.6);opacity:.5}}
@media (max-width:420px){.prow{grid-template-columns:1fr}.ptop{font-size:11px}}

/* daily picture: tall frame above the verse */
.daily-img{margin:0 0 6px;width:100%;aspect-ratio:2/3;max-height:82vh;border:3px solid var(--brown);border-radius:16px;overflow:hidden;background:var(--brown);box-shadow:0 6px 0 var(--brown)}
.daily-img img{width:100%;height:100%;object-fit:cover;object-position:center 45%;display:block}
@media (prefers-reduced-motion:no-preference){.daily-img img{animation:imgIn .7s ease both}@keyframes imgIn{from{opacity:0;transform:scale(1.04)}to{opacity:1;transform:none}}}

/* verse sits on the picture over a soft cherry fade */
.daily-img{position:relative}
.daily-img figcaption{position:absolute;left:0;right:0;bottom:0;padding:70px 18px 18px;display:flex;flex-direction:column;gap:6px;color:#F6F4DF;
  background:linear-gradient(to top,rgba(58,6,6,.94) 0%,rgba(78,9,9,.82) 45%,rgba(120,15,15,0) 100%)}
.daily-img figcaption .label{color:#ACC048}
.daily-img blockquote{margin:0;font-size:clamp(16px,4.6vw,20px);font-weight:600;line-height:1.4;text-wrap:pretty;text-shadow:0 1px 8px rgba(0,0,0,.35)}
.daily-img cite{font-family:var(--display);font-style:normal;font-size:15px;color:#ACC048}
.daily .row{margin-top:4px}
</style>

<script>
/* ---------- content (verses: King James Version, public domain) ---------- */
const UNITS=[
 {title:"Foundations",sub:"The first steps of faith",lessons:[
  {id:"jesus",name:"Who is Jesus?",qs:[
   {t:"mc",q:"According to John 3:16, why did God send His Son?",o:["Because He loved the world","Because people were already perfect","To start a new religion","To condemn the world"],a:0,why:"“For God so loved the world, that he gave his only begotten Son.” It all starts with love."},
   {t:"fill",q:"Complete what Jesus said about Himself.",v:"Jesus saith unto him, I am the way, the ___, and the life.",ref:"John 14:6",o:["truth","light","door","word"],a:0,why:"Jesus is the way, the truth, and the life. No one comes to the Father except through Him."},
   {t:"mc",q:"What do Christians celebrate at Easter?",o:["Jesus being born","Jesus rising from the dead","Moses parting the sea","The first church service"],a:1,why:"Easter celebrates the resurrection. Jesus defeated death, which is the heart of the good news."},
   {t:"build",q:"Build the start of John 3:16.",w:"For God so loved the world",x:["hated","saw"],ref:"John 3:16",why:"This is one of the best-known verses in the whole Bible. A great first one to memorise."}]},
  {id:"grace",name:"Grace",qs:[
   {t:"fill",q:"Fill in the missing word.",v:"For by ___ are ye saved through faith; and that not of yourselves: it is the gift of God.",ref:"Ephesians 2:8",o:["grace","works","law","effort"],a:0,why:"Salvation comes by grace, through faith. It is received, not earned."},
   {t:"mc",q:"Which best describes grace?",o:["A reward for being good","God’s kindness we don’t deserve and can’t earn","A church ritual","Something only pastors have"],a:1,why:"Grace is God’s undeserved favour, freely given."},
   {t:"mc",q:"Can you earn salvation by being good enough?",o:["Yes, if you do more good than bad","Yes, by going to church every week","No, it is a gift from God","Only if you never sin again"],a:2,why:"Ephesians 2:8–9 says it is the gift of God, “not of works, lest any man should boast.”"},
   {t:"build",q:"Build the end of Ephesians 2:8.",w:"it is the gift of God",x:["prize","earned"],ref:"Ephesians 2:8",why:"A gift is received with open hands. That is how grace works."}]},
  {id:"prayer",name:"Prayer",qs:[
   {t:"fill",q:"How often should we pray?",v:"Pray without ___.",ref:"1 Thessalonians 5:17",o:["ceasing","words","fear","music"],a:0,why:"Prayer can be an ongoing conversation with God through the whole day."},
   {t:"mc",q:"When are you allowed to talk to God?",o:["Only in church","Only before meals","Any time, anywhere","Only after reading the Bible"],a:2,why:"You can pray on the bus, in class, in bed. God is always listening."},
   {t:"mc",q:"Philippians 4:6 says to bring your requests to God with…",o:["worry","thanksgiving","perfect words","a loud voice"],a:1,why:"“In every thing by prayer and supplication with thanksgiving let your requests be made known unto God.”"},
   {t:"build",q:"Build the first line of the Lord’s Prayer.",w:"Our Father which art in heaven",x:["earth","king"],ref:"Matthew 6:9",why:"Jesus taught His disciples this prayer as a pattern for how to pray."}]},
  {id:"bible",name:"Reading the Bible",qs:[
   {t:"mc",q:"How many books are in the Protestant Bible?",o:["39","27","66","73"],a:2,why:"66 books: 39 in the Old Testament and 27 in the New Testament."},
   {t:"fill",q:"What does God’s word do for us?",v:"Thy word is a ___ unto my feet, and a light unto my path.",ref:"Psalm 119:105",o:["lamp","rock","map","song"],a:0,why:"Scripture shows us the next step, like a lamp on a dark path."},
   {t:"mc",q:"Which book opens the New Testament?",o:["Genesis","Matthew","Acts","Revelation"],a:1,why:"Matthew is the first of the four Gospels, which tell the story of Jesus."},
   {t:"mc",q:"Which of these is one of the four Gospels?",o:["Romans","Psalms","John","Acts"],a:2,why:"Matthew, Mark, Luke and John. The Gospel of John is a lovely place for a new believer to start."}]},
  {id:"church",name:"Community",qs:[
   {t:"fill",q:"Why meet with other believers?",v:"Not forsaking the ___ of ourselves together, as the manner of some is.",ref:"Hebrews 10:25",o:["assembling","judging","counting","naming"],a:0,why:"Faith grows best with others. Find a church family where you can belong."},
   {t:"mc",q:"In Acts 2:42, what did the first believers devote themselves to?",o:["The apostles’ teaching","Fellowship and breaking bread","Prayer","All of these"],a:3,why:"They learned together, ate together and prayed together."},
   {t:"build",q:"Build Jesus’ new command.",w:"that ye love one another",x:["judge","ignore"],ref:"John 13:34",why:"Love is the mark of a follower of Jesus."}]}
 ]},
 {title:"Walking with God",sub:"Growing deeper every day",lessons:[
  {id:"faith",name:"Faith",qs:[
   {t:"fill",q:"Complete the definition of faith.",v:"Now faith is the substance of things hoped for, the evidence of things not ___.",ref:"Hebrews 11:1",o:["seen","known","heard","done"],a:0,why:"Faith trusts God even when we can’t see the whole picture yet."},
   {t:"mc",q:"Who built an ark by faith?",o:["Moses","Noah","David","Peter"],a:1,why:"Hebrews 11:7 tells how Noah obeyed God before a single drop of rain fell."},
   {t:"build",q:"Build the start of Proverbs 3:5.",w:"Trust in the LORD with all thine heart",x:["mind","some"],ref:"Proverbs 3:5",why:"All your heart, not part of it. God is worthy of full trust."}]},
  {id:"forgive",name:"Forgiveness",qs:[
   {t:"mc",q:"Peter asked if he should forgive seven times. What did Jesus answer?",o:["Just once","Seven times is enough","Seventy times seven","Never"],a:2,why:"Matthew 18:22. Jesus meant forgiveness without keeping count."},
   {t:"fill",q:"What does God do when we confess?",v:"If we confess our sins, he is ___ and just to forgive us our sins.",ref:"1 John 1:9",o:["faithful","angry","slow","silent"],a:0,why:"God is faithful to forgive. You never need to hide from Him."},
   {t:"build",q:"Build the start of Ephesians 4:32.",w:"be ye kind one to another",x:["cold","against"],ref:"Ephesians 4:32",why:"We forgive others because God in Christ forgave us."}]},
  {id:"fruit",name:"Fruit of the Spirit",qs:[
   {t:"mc",q:"Which of these is NOT a fruit of the Spirit?",o:["Love","Peace","Pride","Gentleness"],a:2,why:"Galatians 5:22–23 lists love, joy, peace, longsuffering, gentleness, goodness, faith, meekness and temperance."},
   {t:"fill",q:"Fill in the fruit.",v:"But the fruit of the Spirit is love, joy, ___, longsuffering, gentleness, goodness, faith.",ref:"Galatians 5:22",o:["peace","power","wealth","fame"],a:0,why:"Peace grows in us as we walk with the Holy Spirit."},
   {t:"mc",q:"What does “longsuffering” mean?",o:["Being sick a long time","Patience","Fasting","Being sad"],a:1,why:"Longsuffering is patience: staying kind even when things take time."}]}
 ]},
 {title:"Stories of Faith",sub:"People who trusted God",lessons:[
  {id:"creation",name:"Creation",qs:[
   {t:"fill",q:"How does the Bible begin?",v:"In the beginning God created the ___ and the earth.",ref:"Genesis 1:1",o:["heaven","sun","people","sea"],a:0,why:"Everything starts with God. He made it all, and He made you on purpose."},
   {t:"mc",q:"What did God do on the seventh day?",o:["Made the animals","Rested","Made the stars","Flooded the earth"],a:1,why:"Genesis 2:2 says God rested. Rest is part of His good design for us too."},
   {t:"mc",q:"Who were the first man and woman?",o:["Abraham and Sarah","Adam and Eve","Isaac and Rebekah","Joseph and Mary"],a:1,why:"Adam and Eve were created in God’s image (Genesis 1:27)."},
   {t:"build",q:"Build the first words of the Bible.",w:"In the beginning God created",x:["man","ended"],ref:"Genesis 1:1",why:"Four words that set the scene for the whole story of Scripture."}]},

function dailyItem(){const d=new Date();const doy=Math.floor((d-new Date(d.getFullYear(),0,0))/864e5);return DAILY[doy%DAILY.length]}
function dailyVerse(){return dailyItem().v}

function viewLearn(){
 const L=allLessons();const cur=L.findIndex(l=>!S.done[l.id]);const dv=dailyVerse();
 const offs=[0,56,76,56,0,-56,-76,-56];let k=0,gi=0;
 let units=UNITS.map((u,ui)=>{
  const doneN=u.lessons.filter(l=>S.done[l.id]).length;
  const nodes=u.lessons.map(l=>{const i=gi++;const off=offs[k++%offs.length];
   const st=S.done[l.id]?"done":i===cur?"current":"locked";
   const side=off>0?"right":"left";
   const inner=st==="done"?ICON.check:st==="current"?ICON.star:ICON.lock;
   return `<button class="node ${st} ${side}" style="transform:translateX(${off}px)" data-lesson="${l.id}" ${st==="locked"?'aria-disabled="true"':""} aria-label="${esc(l.name)}${st==="locked"?" (locked)":""}">
     ${st==="current"?'<span class="tag">Start</span>':""}<span class="disc">${inner}</span><span class="name">${esc(l.name)}</span></button>`}).join("");
  return `<section class="unit"><div class="unit-banner tex"><div><small>Unit ${ui+1}</small><h3>${esc(u.title)}</h3><small>${esc(u.sub)}</small></div><span class="count">${doneN}/${u.lessons.length}</span></div><div class="path">${nodes}</div></section>`}).join("");
 const allDone=cur===-1;
 return `
 <section class="hero tex">
  <span class="kicker">${S.name?`${greet()}, ${esc(S.name)}!`:"Grow in Him!"}</span>
  <div class="title-wrap" id="titleWrap" tabindex="0" role="button" aria-label="Show the Roots drawing"><div class="roots-logo" aria-hidden="true"></div><h1>ROOT<br>ED</h1></div>
  <div class="hero-foot">
   <div class="hero-copy"><p class="hint">Tap or hover the name</p><p>${S.stage==="new"?"Welcome to the family! Start with who Jesus is.":S.stage==="returning"?"Welcome home. God is glad you are here.":S.stage==="growing"?"Keep growing, one day at a time.":"Bite-size Bible lessons for new believers, one day at a time."}</p></div>
   <div class="burst">${burst("#ACC048","#780F0F")}<span><b>${S.streak}</b>day streak</span></div>
  </div>
 </section>
 ${(()=>{const nl=cur===-1?L[0]:L[cur];const ui=UNITS.findIndex(u=>u.lessons.includes(nl));
  return `<button class="btn wide cont" data-lesson="${nl.id}"><span><small>${cur===-1?"Review":"Continue"} · Unit ${ui+1}</small><b>${esc(nl.name)}</b></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>`})()}
 <section class="daily tex"><figure class="daily-img"><img src="${dailyItem().img}" alt="${esc(dailyItem().alt)}" style="object-position:${dailyItem().pos}" decoding="async"><figcaption><span class="label">Verse of the day</span><blockquote>${esc(dv[0])}</blockquote><cite>${esc(dv[1])} KJV</cite></figcaption></figure>
  <div class="row"><button class="btn ghost" data-share="${esc(dv[1])}">Make a share card</button><button class="btn ghost" data-copy="${esc(dv[1])}">Copy verse</button></div></section>
 ${(()=>{const g=S.days[today()]||0;const pct=Math.min(1,g/goalN());const C=2*Math.PI*26;
  return `<section class="goal tex"><svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="26" fill="none" stroke="var(--line)" stroke-width="8"/><circle cx="32" cy="32" r="26" fill="none" stroke="var(--pink)" stroke-width="8" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct)}" transform="rotate(-90 32 32)"/><text x="32" y="37" text-anchor="middle" font-family="Bowlby One,sans-serif" font-size="14" fill="currentColor">${Math.round(pct*100)}%</text></svg>
  <div><span class="label">Daily goal</span><h3>${g>=goalN()?"Goal reached!":`${g} / ${goalN()} seeds`}</h3><p>${g>=goalN()?"Come back tomorrow to grow your streak.":"Finish a lesson, memorise a verse or read a chapter."}</p>${weekStrip()}</div></section>`})()}
 <div class="divider" aria-hidden="true"></div>
 <div class="shead"><h2>Your path</h2><span class="script">${allDone?"All done!":"Keep going"}</span></div>
 ${units}
 ${allDone?'<div class="empty">You finished every lesson. Replay any lesson to review, and new units will grow here.</div>':""}`}

function viewFeel(){
 const m=MOODS.find(x=>x.id===S.mood);
 const chips=MOODS.map(x=>`<button class="mood" data-mood="${x.id}" aria-pressed="${x.id===S.mood}" style="--c:${x.c}"><i></i>${esc(x.label)}</button>`).join("");
 let card=`<div class="empty">Pick how you feel and Rooted will find a verse for this moment, with a short prayer prompt.</div>`;
 if(m){const v=m.vs[S.moodIdx%m.vs.length];const isSaved=S.saved.some(s=>s[1]===v[1]);
  card=`<article class="verse-card tex"><span class="script">A word for when you feel ${esc(m.label.toLowerCase())}</span>
   <blockquote>${esc(v[0])}</blockquote><cite>${esc(v[1])}</cite>
   <div class="reflect"><b>Pray it</b>${esc(m.prompt)}</div>
   <div class="row"><button class="btn" id="another">Another verse</button><button class="btn ghost" id="saveV">${isSaved?"Saved":"Save verse"}</button><button class="btn ghost" data-share="${esc(v[1])}">Share</button></div></article>`}
 return `<div class="shead"><h2 class="soft">How are you feeling?</h2><span class="script">Be honest</span></div>
 <div class="moods">${chips}</div>${card}
 <div class="divider" aria-hidden="true"></div>
 <div class="shead"><h2 class="soft">Prayer journal</h2><span class="script">Talk to Him</span></div>
 <div class="journal"><label class="label" for="journalText">${m?`Write a prayer about feeling ${esc(m.label.toLowerCase())}`:"Write a prayer"}</label>
  <textarea id="journalText" placeholder="Dear God, today I…"></textarea>
  <div class="row"><button class="btn" id="saveJ">Save prayer</button></div>
  ${S.journal.length?S.journal.slice(0,6).map((j,i)=>`<article class="entry"><header><span>${esc(j.d)}${j.m?" \u00b7 "+esc(j.m):""}</span><button class="x" data-unj="${i}" aria-label="Delete prayer">Delete</button></header><p>${esc(j.t)}</p></article>`).join(""):'<div class="empty">Your saved prayers will appear here. Looking back at them later shows how God has answered.</div>'}
 </div>`}

function viewJourney(){
 const st=stage();const idx=STAGES.indexOf(st);const next=STAGES[idx+1];
 const pct=next?Math.round((S.xp-st.xp)/(next.xp-st.xp)*100):100;
 const doneN=Object.keys(S.done).length;
 const saved=S.saved.length?S.saved.map((s,i)=>`<div class="saved-item"><p>${esc(s[0])}<cite>${esc(s[1])}</cite></p><button class="x" data-unsave="${i}" aria-label="Remove ${esc(s[1])}">Remove</button></div>`).join(""):`<div class="empty">Verses you save from Feelings will live here, ready to reread.</div>`;

  if(ok){const f=$("#fb");f&&confetti(f.querySelector("h4"),LS.combo>=3?22:12)}else{const a=$("#ans");if(a){a.classList.add("shake")}}
  return}
 if(t.closest("#next")){LS.i++;LS.pick=null;LS.built=[];LS.bank=null;LS.checked=false;
  if(LS.i>=LS.l.qs.length)drawFinish();else drawQ()}
});
$("#lessonIn").addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="obName"){e.preventDefault();$("[data-ob]").click()}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#lesson").hidden&&S.onboarded)closeOverlay()});


/* ---------- brush textures (original, generated) ---------- */
(function makeTextures(){
 let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
 function brush(ctx,pts,w){const bristles=9;
  for(let b=0;b<bristles;b++){const off=(b/(bristles-1)-.5)*w*.9;ctx.lineWidth=w/bristles*1.9;ctx.globalAlpha=.75+rnd()*.25;
   ctx.beginPath();let pen=false;
   for(let i=1;i<pts.length;i++){const [x0,y0]=pts[i-1],[x1,y1]=pts[i];const dx=x1-x0,dy=y1-y0,L=Math.hypot(dx,dy)||1;const nx=-dy/L,ny=dx/L;
    const gap=rnd()<(b===0||b===bristles-1?.12:.03);
    if(gap){pen=false;continue}
    const jx=(rnd()-.5)*1.2,jy=(rnd()-.5)*1.2;
    if(!pen){ctx.moveTo(x0+nx*off,y0+ny*off);pen=true}
    ctx.lineTo(x1+nx*off+jx,y1+ny*off+jy)}
   ctx.stroke()}ctx.globalAlpha=1}
 function make(W,H,draw){const c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d");x.strokeStyle="#fff";x.lineCap="round";x.lineJoin="round";draw(x,W,H);
  try{return `url(${c.toDataURL("image/png")})`}catch(e){return "none"}}
 const T={};
 T.waves=make(360,360,(x,W,H)=>{for(let r=0;r<9;r++){const y0=20+r*40,amp=6+rnd()*6,f=.018+rnd()*.01,ph=rnd()*6;const pts=[];for(let X=-10;X<=W+10;X+=6)pts.push([X,y0+Math.sin(X*f+ph)*amp]);brush(x,pts,18)}});
 T.arches=make(360,360,(x,W,H)=>{const cx=W/2,cy=H*.95;for(let k=0;k<6;k++){const R=40+k*30;const pts=[];for(let a=Math.PI;a<=2*Math.PI+.01;a+=.05)pts.push([cx+Math.cos(a)*R+(rnd()-.5)*2,cy+Math.sin(a)*R*1.1]);brush(x,pts,17)}});
 T.streaks=make(240,360,(x,W,H)=>{for(let k=0;k<9;k++){const x0=-60+k*38,pts=[];for(let t=0;t<=1.001;t+=.04)pts.push([x0+t*120+Math.sin(t*5+k)*6,H*(1-t)]);brush(x,pts,14)}});
 T.scribble=make(360,360,(x,W,H)=>{for(let r=0;r<6;r++){const y0=30+r*60,pts=[];for(let t=0;t<W+20;t+=2){const a=t*.14;pts.push([t+Math.cos(a)*10,y0+Math.sin(a)*14+Math.sin(t*.02+r)*5])}brush(x,pts,4)}});
 T.swirl=make(360,360,(x,W,H)=>{const cx=W/2,cy=H/2;const pts=[];for(let a=0;a<Math.PI*9;a+=.06){const R=8+a*5.6;pts.push([cx+Math.cos(a)*R,cy+Math.sin(a)*R*.9])}brush(x,pts,16)});
 T.grain=make(180,180,(x,W,H)=>{x.fillStyle="#fff";for(let k=0;k<2600;k++){x.globalAlpha=.25+rnd()*.75;const r=rnd()*1.3+.3;x.fillRect(rnd()*W,rnd()*H,r,r)}x.globalAlpha=1});
 T.line=make(400,40,(x,W,H)=>{const pts=[];for(let X=0;X<=W;X+=4)pts.push([X,H/2+Math.sin(X/W*Math.PI*4)*9]);brush(x,pts,10)});
 for(const k in T)document.documentElement.style.setProperty("--t-"+k,T[k]);
})();

render();
if(!S.onboarded)openOnboarding();
</script>
